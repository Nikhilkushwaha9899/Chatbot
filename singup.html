<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">   
<title>Sign Up - Chatbot</title>  
<style>
*{
    padding:0;
    margin:0;
}    
body {
    font-family: Arial;
    background: linear-gradient(135deg, #2d1b4e 0%, #1a0f3a 50%, #3d2863 100%);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  .background-animation {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .shape {
    position: absolute;
    opacity: 0.15;
    animation: float 20s infinite ease-in-out;
  }

  .shape.circle {
    border-radius: 50%;
    background: rgba(138,43,226,1);
  }

  .shape.square {
    background: rgba(147, 51, 234, 1);
    transform: rotate(45deg);
  }

  .shape.triangle {
    width: 0;
    height: 0;
    background: transparent;
    border-left: 75px solid transparent;
    border-right: 75px solid transparent;
    border-bottom: 130px solid rgba(168, 85, 247, 1);
  }
  .shape:nth-child(1) {
    width: 200px;
    height: 200px;
    top: 10%;
    left: 10%;
    animation-delay: 0s;
    animation-duration: 25s;
  }

  .shape:nth-child(2) {
    width: 150px;
    height: 150px;
    top: 60%;
    left: 80%;
    animation-delay: -5s;
    animation-duration: 20s;
  }

  .shape:nth-child(3) {
    width: 100px;
    height: 100px;
    top: 70%;
    left: 15%;
    animation-delay: -10s;
    animation-duration: 30s;
  }

  .shape:nth-child(4) {
    width: 180px;
    height: 180px;
    top: 20%;
    left: 75%;
    animation-delay: -15s;
    animation-duration: 22s;
  }

  .shape:nth-child(5) {
    width: 120px;
    height: 120px;
    top: 80%;
    left: 50%;
    animation-delay: -8s;
    animation-duration: 28s;
  }

  .shape:nth-child(6) {
    top: 40%;
    left: 20%;
    animation-delay: -12s;
    animation-duration: 26s;
  }

  @keyframes float {
    0%, 100% {
      transform: translate(0, 0) rotate(0deg);
    }
    25% {
      transform: translate(30px, -30px) rotate(90deg);
    }
    50% {
      transform: translate(-20px, 20px) rotate(180deg);
    }
    75% {
      transform: translate(40px, 10px) rotate(270deg);
    }
  }
#content {
    position: relative;
    z-index: 1;
  }
#red {
    background:linear-gradient(to bottom,#cd1c18,#e55451);
    width: 400px;
    height:50px;
    font-size:25px;
    color: white;
    border-radius: 10px;
    padding: 20px;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
    margin:15px;
  }
.red{
    display:flex;
    justify-content:center;
  }
p{
  text-align:center;
}
#signbox{
    width: 400px;
    margin: auto;
    margin-bottom:15px;
    background:linear-gradient(to top,#C797EB,#F0ECFC);
    padding: 40px;
    border-radius: 10px;
    height:800px;

    border-top-right-radius:0;
}
h1 {
    text-align: center;
    margin:auto;
    background:linear-gradient(to bottom,#994ECC,#3E187A);
    line-height: 2;
    color: white;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 28px;

    border-top-left-radius:10px;
    border-top-right-radius:10px;
    width:470px;
  }
  #one{
    background: linear-gradient(to bottom, #1e7b1e, #2ea02e);

    padding: 18px;

    text-align: center;

#one:hover{
    background: linear-gradient(to bottom, #267326, #3bc73b);
    transform: translateY(-5px) scale(1.1);
    box-shadow: 0 8px 25px rgb(0, 0, 0);
}
h2{
  color:#3E187A;
}
label{
  color:#3E187A;
  font-size:20px;
}
input::placeholder{
  font-size:27px;
  padding:3px 0 3px 3px;
}
#name{
  margin:10px;

}
#mail{

#pass{

  margin:10px 0 ;

}
#cpass{

#two:hover{

/* NEW STYLES FOR ERROR/SUCCESS MESSAGES */
.error-message {
  color: #cd1c18;

</style> 
</head>
<body>
  <div class="background-animation">
    <div class="shape circle"></div>
    <div class="shape square"></div>
    <div class="shape circle"></div>
    <div class="shape square"></div>
    <div class="shape circle"></div>
    <div class="shape triangle"></div>
  </div>
  <div id="content">
   <div class=red>
    <div id="red">
      <div id="call">
        <p><b>In Intermediate Crisis?</p>
        <p>Call 988 or text HOME to 741741</p>
      </div>
    </div>
   </div>

   <h1>Suicide Helpline Chatbot</h1>
    <div id="signbox">
     <a href="/chat">
       <button id="one">
        🆘 TALK NOW - No Login Required<br>
        Get immediate anonymous support
       </button>
     </a>
     <pre align="center" style="font-size:20px;color:#3E187A">Or</pre><br>
     
     <form id="signupForm" onsubmit="return false;">
      <div id="main">
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <h2>Create Your Account</h2><br>
        <label>Username</label><br>
        <input type="text" placeholder="Enter your Username" id="name" required><br>
        <label>Email(Optional)</label><br>
        <input type="email" placeholder="For Password Recovery Only" id="mail"><br>
        <label>Password</label><br>
        <input type="password" placeholder="Enter Your Password" id="pass" required><br>
        <label>Confirm Password</label><br>
        <input type="password" placeholder="Confirm Your Password" id="cpass" required><br>
        
        <button id="two" type="button" onclick="handleSignup()"><b>Create Account</b></button>
      </div>
     </form>
     
<div id="jump">Already have an account?<a href="/login" id="_1">Sign in</a></div>
<div id="description">
  <h4>🔒 Your Privacy Matters</h4>
  All conversations are confidential. Account creation is optional and allows you to save your conversation history securely.
</div>
   </div>
 </div>

 <script>
   async function handleSignup() {
     const username = document.getElementById('name').value.trim();
     const email = document.getElementById('mail').value.trim();
     const password = document.getElementById('pass').value;
     const confirmPassword = document.getElementById('cpass').value;
     const errorDiv = document.getElementById('errorMessage');
     const successDiv = document.getElementById('successMessage');
     
  
     errorDiv.style.display = 'none';
     successDiv.style.display = 'none';
     
    
     if (!username || !password || !confirmPassword) {
       errorDiv.textContent = 'Please fill in all required fields';
       errorDiv.style.display = 'block';
       return;
     }
     
     if (password !== confirmPassword) {
       errorDiv.textContent = 'Passwords do not match';
       errorDiv.style.display = 'block';
       return;
     }
     
     if (password.length < 6) {
       errorDiv.textContent = 'Password must be at least 6 characters';
       errorDiv.style.display = 'block';
       return;
     }
     
     try {
       const response = await fetch('/api/signup', {
         method: 'POST',
         headers: {
           'Content-Type': 'application/json'
         },
         body: JSON.stringify({ username, email, password })
       });
       
       const data = await response.json();
       
       if (data.success) {
         successDiv.textContent = 'Account created successfully! Redirecting to login...';
         successDiv.style.display = 'block';
    
         setTimeout(() => {
           window.location.href = '/login';
         }, 2000);
       } else {
         errorDiv.textContent = data.message || 'Signup failed';
         errorDiv.style.display = 'block';
       }
     } catch (error) {
       errorDiv.textContent = 'An error occurred. Please try again.';
       errorDiv.style.display = 'block';
       console.error('Signup error:', error);
     }
   }
   
   document.getElementById('cpass').addEventListener('keypress', function(e) {
     if (e.key === 'Enter') {
       handleSignup();
     }
   });
 </script>
</body>
